baseURL = 'https://roca.tax/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
languageCode = 'en-us'
title = 'Roca Tax'
theme = 'roca-tax-theme'

# The business is closed. The site serves a single closure notice in English
# and Spanish -- no menus, no contact details, no scheduling.
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']

[params]
  description = "Roca Tax has permanently closed and is no longer accepting clients."
  company_name = "Roca Tax"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Roca Tax"
    contentDir = "content/en"

  [languages.es]
    languageName = "Español"
    weight = 2
    title = "Roca Tax"
    contentDir = "content/es"
