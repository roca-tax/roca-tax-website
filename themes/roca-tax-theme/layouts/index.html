{{ define "main" }}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7 text-center">
            <img src="/logo.png" alt="{{ .Site.Params.company_name }}" class="img-fluid mb-4" style="max-height: 120px;">

            {{ .Content }}

            <p class="small text-muted mb-0 mt-4">
                {{ if eq .Site.Language.Lang "es" }}
                    <a href="/en/">English</a>
                {{ else }}
                    <a href="/es/">Español</a>
                {{ end }}
            </p>
        </div>
    </div>
</div>
{{ end }}
